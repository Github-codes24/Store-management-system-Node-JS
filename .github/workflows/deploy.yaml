name: Deploy

on: 
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps: 
       - name: Checkout Code 
         uses: actions/checkout@v4

       - name: Deploy via SSH
         uses: appleboy/ssh-action@v1.0.3
         with: 
            host: ${{secrets.SSH_HOST}}
            username: ${{secrets.VPS_USER}}   
            key: ${{secrets.SSH_KEY}}
            script_stop: true
            script: |
               cd /root/dev/POS/backend/Store-management-system-Node-JS
               git pull
               docker compose up -d --build
               docker compose ps
               docker image prune -f